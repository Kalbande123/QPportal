<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SevaSpot - Question Paper Portal</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 290px; background: #ffffff; border-right: 1px solid #ddd; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 2px 0 5px rgba(0,0,0,0.05); overflow-y: auto; }
        .sidebar h2 { font-size: 18px; color: #333; text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 5px; }
        
        .btn-add { background: #6c757d; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.3s; text-align: left; display: flex; align-items: center; gap: 5px; }
        .btn-add:hover { background: #5a6268; }
        
        .btn-export { background: #17a2b8; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.3s; margin-top: 5px; }
        .btn-export:hover { background: #138496; }

        .ai-box { display: flex; flex-direction: column; gap: 8px; background: #e8f4fd; padding: 12px; border-radius: 8px; border: 1px solid #b8daff; }
        .ai-box input[type="file"] { font-size: 11px; padding: 4px; background: white; border: 1px solid #ccc; border-radius: 4px; }
        .btn-ai { background: #28a745; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 5px;}
        .btn-ai:hover { background: #218838; }
        .btn-ai:disabled { background: #94d3a2; cursor: not-allowed; }

        .editor-container { flex: 1; padding: 30px; overflow-y: auto; display: flex; justify-content: center; background: #e9ecef; }
        .a4-canvas { width: 210mm; min-height: 297mm; background: white; padding: 20mm; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 5px; }

        .paper-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #000; padding-bottom: 15px; }
        .paper-header input { width: 100%; text-align: center; border: 1px dashed transparent; padding: 5px; outline: none; background: transparent; }
        .paper-header input:hover, .paper-header input:focus { border: 1px dashed #007bff; background: #f8f9fa; }
        .school-name { font-size: 24px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .exam-name { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        
        .header-details { display: flex; justify-content: space-between; flex-wrap: wrap; text-align: left; font-size: 14px; font-weight: bold; }
        .detail-item { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
        .detail-item input { text-align: left; width: 100px; font-weight: bold; }

        .question-block { display: flex; gap: 10px; margin-bottom: 15px; padding: 10px; border: 1px dashed #ccc; border-radius: 5px; background: #fff; position: relative; }
        .q-number { font-weight: bold; min-width: 35px; margin-top: 5px; }
        .q-input-area { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .q-text { width: 100%; border: 1px solid #ddd; padding: 8px; border-radius: 4px; resize: vertical; min-height: 50px; font-size: 15px; font-family: inherit; }
        .q-marks-container { display: flex; align-items: center; gap: 5px; font-weight: bold; }
        .q-marks-input { width: 40px; padding: 2px 5px; text-align: center; border: 1px solid #ddd; border-radius: 3px; }

        .diagram-block { border: 2px dashed #007bff; padding: 15px; border-radius: 5px; background: #f8f9fa; margin-bottom: 15px; text-align: center; position: relative; }
        .diagram-title { font-weight: bold; color: #007bff; margin-bottom: 8px; font-size: 14px; }
        .diagram-box { width: 100%; height: 120px; background: white; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; color: #888; font-style: italic; }

        .table-block { border: 1px solid #000; padding: 10px; border-radius: 5px; background: #fff; margin-bottom: 15px; position: relative; }
        .custom-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .custom-table th, .custom-table td { border: 1px solid #000; padding: 6px; text-align: center; }
        .custom-table input { width: 100%; border: none; outline: none; text-align: center; font-family: inherit; }

        .btn-delete { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; position: absolute; top: 5px; right: 5px; }
        .btn-delete:hover { background: #c82333; }

        @media print {
            body { background-color: white; }
            .sidebar { display: none !important; } 
            .editor-container { padding: 0; background: white; display: block; overflow: visible; }
            .a4-canvas { box-shadow: none; border: none; padding: 0; width: 100%; min-height: auto; margin: 0; }
            .paper-header input { border: none !important; }
            .question-block, .diagram-block, .table-block { border: 1px solid #000 !important; background: white !important; }
            .q-text, .q-marks-input, .custom-table input { border: none !important; outline: none !important; resize: none; background: transparent; }
            .btn-delete { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>SevaSpot Portal</h2>
        
        <button class="btn-export" onclick="window.print()">🖨️ Print / Export PDF</button>
        <button class="btn-add" onclick="addQuestion()">➕ Add Question Block</button>
        <button class="btn-add" onclick="addDiagram()">🖼️ Add Diagram Space</button>
        <button class="btn-add" onclick="addTable()">📊 Add Table</button>
        
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 5px 0;">
        
        <div class="ai-box">
            <h3 style="margin-top: 0; color: #0056b3; font-size: 14px;">✨ Smart PDF Reader</h3>
            <input type="file" id="pdfFileInput" accept="application/pdf">
            <button class="btn-ai" id="generateBtn" onclick="processSmartPDF()">✨ Extract & Generate</button>
            <p id="statusText" style="font-size: 11px; color: #007bff; text-align: center; margin: 0;"></p>
        </div>
    </div>

    <div class="editor-container">
        <div class="a4-canvas" id="paper-canvas">
            <div class="paper-header">
                <input type="text" class="school-name" value="HIMALAYA COACHING CLASSES">
                <input type="text" class="exam-name" value="First Term Examination - 2026">
                <div class="header-details">
                    <div class="detail-item">Class: <input type="text" value="10th"></div>
                    <div class="detail-item">Subject: <input type="text" value="English"></div>
                    <div class="detail-item">Marks: <input type="text" value="80"></div>
                    <div class="detail-item">Time: <input type="text" value="3 Hrs"></div>
                </div>
            </div>
            <div id="elements-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
